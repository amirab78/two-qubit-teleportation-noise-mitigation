[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecorr"
version = "1.0.0"
description = "Two-qubit quantum teleportation through a noisy channel, repaired by a counts-only parametric correction: methods, hardware data and analysis."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir H. Abdolhosseini" }]
requires-python = ">=3.11"
keywords = ["quantum teleportation", "quantum noise", "process tomography", "calibration", "Pauli twirl", "IBM Quantum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
# pinned: the versions every result in this repository was produced and checked with
dependencies = [
    "numpy==2.2.4",
    "scipy==1.15.2",
    "matplotlib==3.10.1",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
# only needed to retrain the reinforcement-learning agents of the research project (not used by this repository)
rl = ["stable-baselines3==2.9.0", "gymnasium==1.3.0", "torch==2.14.0"]

[project.urls]
Repository = "https://github.com/amirab78/two-qubit-teleportation-noise-mitigation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = ["slow: takes more than about 30 s"]
